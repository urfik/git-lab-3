<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наш первый сайт, сделал мурашов</title>
    <h1>DEMO</h1>
    <style>
        /* Базовые настройки для всей страницы */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* Стиль для карточки профиля */
        .profile-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            margin-top: 40px;
        }

        /* Аватарка с GitHub */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #007bff;
            object-fit: cover;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* Заголовки */
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Текстовые блоки */
        .content-box {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            margin: 15px 0;
            text-align: left;
        }

        p {
            margin: 5px 0;
        }

        /* Подвал сайта */
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #95a5a6;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        
        <img src="https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fre-st.ru%2Finteresnoe%2Ftcentral-noe-otoplenie-istoriia-ego-poiavleniia-i-razvitiia%2F&ved=0CBcQjRxqFwoTCNivhKCRjJcDFQAAAAAdAAAAABA3&opi=89978449" alt="Описание картинки" width="600" height="400">

        <h1>Привет!</h1>
        <div class="subtitle">Размещен с помощью GitHub Pages</div>

        <div class="content-box">
            <p><strong>Обновление:</strong> Добавлен новый подвал.</p>
        </div>

        <div class="content-box">
            <p><strong>Обновление:</strong> На сайт успешно добавлен новый параграф.</p>
        </div>

        <div class="content-box">
            <p><strong>Поправка №3:</strong> Структура сайта оптимизирована.</p>
            <p><strong>Поправка №1:</strong> Стили успешно применены.</p>
        </div>

        <footer>
            &copy; 2026 год, мой сайт
        </footer>
    </div>

</body>
</html>
